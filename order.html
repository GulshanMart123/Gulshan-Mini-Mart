<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Gulshan Mini Mart — Order Online</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Arial,sans-serif;background:#f4f1ea;color:#2b2b2b;padding-bottom:90px}
  .header{background:linear-gradient(135deg,#8b0000 0%,#b71c1c 48%,#8f1010 100%);color:#fff;padding:16px 14px;text-align:center;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.25)}
  .header h1{font-size:1.15rem;letter-spacing:.5px}
  .header p{font-size:.72rem;opacity:.85;margin-top:2px}
  .search-bar{padding:10px 12px;background:#fff;position:sticky;top:64px;z-index:40;box-shadow:0 2px 4px rgba(0,0,0,.06)}
  .search-bar input{width:100%;padding:10px 14px;border:1.5px solid #ddd;border-radius:20px;font-size:.9rem;outline:none}
  .search-bar input:focus{border-color:#b71c1c}
  .cats{display:flex;gap:7px;overflow-x:auto;padding:9px 12px;background:#fff;border-bottom:1px solid #eee}
  .cats::-webkit-scrollbar{display:none}
  .cat-chip{flex-shrink:0;padding:6px 13px;border-radius:16px;background:#f1efe8;font-size:.78rem;font-weight:600;color:#555;white-space:nowrap;cursor:pointer;border:1.5px solid transparent}
  .cat-chip.active{background:#b71c1c;color:#fff}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;padding:12px}
  .card{background:#fff;border-radius:12px;padding:11px;box-shadow:0 1px 4px rgba(0,0,0,.08);display:flex;flex-direction:column;gap:5px}
  .card .name{font-size:.85rem;font-weight:700;line-height:1.25;min-height:2.1em}
  .card .unit{font-size:.68rem;color:#888}
  .card .price-row{display:flex;justify-content:space-between;align-items:center;margin-top:3px}
  .card .price{font-size:.95rem;font-weight:800;color:#b71c1c;font-family:monospace}
  .card .mrp{font-size:.68rem;color:#999;text-decoration:line-through;margin-left:4px}
  .addbtn{background:#2E7D32;color:#fff;border:none;border-radius:8px;padding:7px 0;font-size:.82rem;font-weight:700;cursor:pointer;margin-top:4px}
  .qtybox{display:flex;align-items:center;justify-content:space-between;background:#2E7D32;border-radius:8px;margin-top:4px;overflow:hidden}
  .qtybox button{background:transparent;border:none;color:#fff;font-size:1.1rem;font-weight:800;padding:5px 13px;cursor:pointer}
  .qtybox span{color:#fff;font-weight:700;font-family:monospace}
  .empty{grid-column:1/-1;text-align:center;padding:40px 10px;color:#999;font-size:.88rem}
  .cart-bar{position:fixed;bottom:0;left:0;right:0;background:#1c1c1c;color:#fff;padding:12px 16px;display:none;align-items:center;justify-content:space-between;box-shadow:0 -2px 10px rgba(0,0,0,.25);z-index:60}
  .cart-bar.show{display:flex}
  .cart-bar .info{font-size:.82rem}
  .cart-bar .info b{font-size:1.05rem;color:#FFD700;font-family:monospace}
  .cart-bar button{background:#b71c1c;color:#fff;border:none;padding:10px 20px;border-radius:24px;font-size:.88rem;font-weight:700;cursor:pointer}
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:flex-end;justify-content:center}
  .modal-overlay.show{display:flex}
  .sheet{background:#fff;width:100%;max-width:480px;border-radius:16px 16px 0 0;max-height:88vh;overflow-y:auto;padding:18px}
  .sheet h2{font-size:1.05rem;margin-bottom:12px;color:#b71c1c}
  .cart-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f0f0f0;gap:8px}
  .cart-row .nm{font-size:.85rem;font-weight:600;flex:1}
  .cart-row .qc{display:flex;align-items:center;gap:8px}
  .cart-row .qc button{width:24px;height:24px;border-radius:6px;border:1px solid #ddd;background:#f7f7f7;font-weight:700;cursor:pointer}
  .cart-row .amt{font-family:monospace;font-weight:700;min-width:60px;text-align:right}
  .field{margin-bottom:11px}
  .field label{display:block;font-size:.75rem;color:#666;margin-bottom:4px;font-weight:600}
  .field input,.field textarea,.field select{width:100%;padding:10px 12px;border:1.5px solid #ddd;border-radius:8px;font-size:.9rem;outline:none;font-family:inherit}
  .field input:focus,.field textarea:focus{border-color:#b71c1c}
  .totalrow{display:flex;justify-content:space-between;padding:11px 0;font-size:1.05rem;font-weight:800;border-top:2px solid #eee;margin-top:6px}
  .placebtn{width:100%;background:#2E7D32;color:#fff;border:none;padding:14px;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:10px}
  .placebtn:disabled{background:#aaa}
  .closebtn{text-align:right;color:#999;font-size:1.3rem;cursor:pointer;line-height:1}
  .success{text-align:center;padding:40px 20px}
  .success .tick{font-size:3.2rem;margin-bottom:10px}
  .success h2{color:#2E7D32;margin-bottom:8px}
  .success p{color:#666;font-size:.88rem;line-height:1.6}
  .success .oid{font-family:monospace;font-weight:700;color:#b71c1c;font-size:1.1rem;margin:10px 0}
  .loading{text-align:center;padding:60px 20px;color:#999}
</style>
</head>
<body>

<div class="header">
  <h1>🛒 GULSHAN MINI MART</h1>
  <p>Order online — Home Delivery Available</p>
</div>

<div class="search-bar">
  <input type="text" id="search" placeholder="Search products…" oninput="renderGrid()">
</div>
<div class="cats" id="cats"></div>
<div class="grid" id="grid"><div class="loading">Loading products…</div></div>

<div class="cart-bar" id="cartBar">
  <div class="info"><span id="cartCount">0</span> items — <b id="cartTotal">₹0</b></div>
  <button onclick="openCart()">View Cart →</button>
</div>

<!-- CART / CHECKOUT MODAL -->
<div class="modal-overlay" id="cartModal">
  <div class="sheet">
    <div class="closebtn" onclick="closeModal('cartModal')">✕</div>
    <h2>🛍️ Your Cart</h2>
    <div id="cartItems"></div>
    <div class="totalrow"><span>Total</span><span id="cartModalTotal">₹0</span></div>
    <button class="placebtn" onclick="goToCheckout()" id="cartNextBtn">Proceed to Delivery Details →</button>
  </div>
</div>

<!-- CHECKOUT DETAILS MODAL -->
<div class="modal-overlay" id="checkoutModal">
  <div class="sheet">
    <div class="closebtn" onclick="closeModal('checkoutModal')">✕</div>
    <h2>📍 Delivery Details</h2>
    <div class="field"><label>Your Name *</label><input id="custName" placeholder="Full name"></div>
    <div class="field"><label>Mobile Number *</label><input id="custPhone" type="tel" maxlength="10" placeholder="10-digit mobile"></div>
    <div class="field"><label>Delivery Address *</label><textarea id="custAddress" rows="3" placeholder="House no, street, landmark…"></textarea></div>
    <div class="field"><label>Notes (optional)</label><input id="custNotes" placeholder="Any instructions"></div>
    <div class="totalrow"><span>Total to Pay</span><span id="checkoutTotal">₹0</span></div>
    <p style="font-size:.74rem;color:#888;margin-top:4px">Payment: Cash on Delivery</p>
    <button class="placebtn" id="placeOrderBtn" onclick="placeOrder()">✅ Place Order</button>
  </div>
</div>

<!-- SUCCESS MODAL -->
<div class="modal-overlay" id="successModal">
  <div class="sheet">
    <div class="success">
      <div class="tick">✅</div>
      <h2>Order Placed!</h2>
      <div class="oid" id="orderIdShow"></div>
      <p>Gulshan Mini Mart will confirm your order shortly.<br>Pay cash when it's delivered to you.</p>
      <button class="placebtn" style="margin-top:20px" onclick="location.reload()">Order More</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
// ── FIREBASE CONFIG (filled in by Claude once Naushad shares it) ──
const firebaseConfig = {
  apiKey: "AIzaSyCPwZw2CS2IO9ObrYgop6duIJSICQxCdUk",
  authDomain: "gulshan-mini-mart.firebaseapp.com",
  projectId: "gulshan-mini-mart",
  storageBucket: "gulshan-mini-mart.firebasestorage.app",
  messagingSenderId: "577707476594",
  appId: "1:577707476594:web:cf435efcb0164aeda1e4eb"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let PRODUCTS = [];
let CATS = [];
let activeCat = 'ALL';
let cart = {}; // id -> {id,name,price,mrp,unit,qty}

function fmt(n){ return '₹'+(parseFloat(n)||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

async function loadCatalog(){
  try{
    const doc = await db.collection('catalog').doc('products').get();
    if(doc.exists){
      const data = doc.data();
      PRODUCTS = (data.items||[]).filter(p=>p.price>0);
      const catSet = {};
      PRODUCTS.forEach(p=>{ if(p.cat) catSet[p.cat]=true; });
      CATS = Object.keys(catSet).sort();
    }
  }catch(e){
    document.getElementById('grid').innerHTML = '<div class="empty">Could not load products. Please check your internet and reload.</div>';
    console.error(e);
    return;
  }
  renderCats();
  renderGrid();
}

function renderCats(){
  const box = document.getElementById('cats');
  let h = '<div class="cat-chip'+(activeCat==='ALL'?' active':'')+'" onclick="setCat(\'ALL\')">All</div>';
  CATS.forEach(c=>{ h += '<div class="cat-chip'+(activeCat===c?' active':'')+'" onclick="setCat('+JSON.stringify(c)+')">'+esc(c)+'</div>'; });
  box.innerHTML = h;
}
function setCat(c){ activeCat=c; renderCats(); renderGrid(); }

function renderGrid(){
  const q = (document.getElementById('search').value||'').toLowerCase();
  let list = PRODUCTS;
  if(activeCat!=='ALL') list = list.filter(p=>p.cat===activeCat);
  if(q) list = list.filter(p=>(p.name||'').toLowerCase().indexOf(q)>-1);
  const grid = document.getElementById('grid');
  if(!list.length){ grid.innerHTML = '<div class="empty">No products found</div>'; return; }
  grid.innerHTML = list.map(p=>{
    const inCart = cart[p.id];
    const mrpHtml = (p.mrp && p.mrp>p.price) ? '<span class="mrp">'+fmt(p.mrp)+'</span>' : '';
    return '<div class="card">'+
      '<div class="name">'+esc(p.name)+'</div>'+
      '<div class="unit">'+esc(p.unit||'pcs')+'</div>'+
      '<div class="price-row"><span class="price">'+fmt(p.price)+mrpHtml+'</span></div>'+
      (inCart
        ? '<div class="qtybox"><button onclick="changeQty(\''+p.id+'\',-1)">−</button><span>'+inCart.qty+'</span><button onclick="changeQty(\''+p.id+'\',1)">+</button></div>'
        : '<button class="addbtn" onclick="addToCart(\''+p.id+'\')">+ Add</button>')+
      '</div>';
  }).join('');
}

function addToCart(id){
  const p = PRODUCTS.find(x=>String(x.id)===String(id));
  if(!p) return;
  cart[id] = { id:p.id, name:p.name, price:p.price, mrp:p.mrp||p.price, unit:p.unit||'pcs', qty:1 };
  renderGrid(); updateCartBar();
}
function changeQty(id, d){
  if(!cart[id]) return;
  cart[id].qty += d;
  if(cart[id].qty<=0) delete cart[id];
  renderGrid(); updateCartBar();
  if(document.getElementById('cartModal').classList.contains('show')) renderCartModal();
}
function cartTotal(){ return Object.values(cart).reduce((s,i)=>s+i.price*i.qty,0); }
function cartCount(){ return Object.values(cart).reduce((s,i)=>s+i.qty,0); }
function updateCartBar(){
  const n = cartCount();
  document.getElementById('cartBar').classList.toggle('show', n>0);
  document.getElementById('cartCount').textContent = n;
  document.getElementById('cartTotal').textContent = fmt(cartTotal());
}

function openCart(){ renderCartModal(); document.getElementById('cartModal').classList.add('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
function renderCartModal(){
  const box = document.getElementById('cartItems');
  const items = Object.values(cart);
  if(!items.length){ box.innerHTML = '<p style="color:#999;text-align:center;padding:20px 0">Cart is empty</p>'; }
  else{
    box.innerHTML = items.map(i=>
      '<div class="cart-row"><div class="nm">'+esc(i.name)+'</div>'+
      '<div class="qc"><button onclick="changeQty(\''+i.id+'\',-1)">−</button><span>'+i.qty+'</span><button onclick="changeQty(\''+i.id+'\',1)">+</button></div>'+
      '<div class="amt">'+fmt(i.price*i.qty)+'</div></div>'
    ).join('');
  }
  document.getElementById('cartModalTotal').textContent = fmt(cartTotal());
  document.getElementById('cartNextBtn').disabled = items.length===0;
}
function goToCheckout(){
  if(!Object.keys(cart).length) return;
  closeModal('cartModal');
  document.getElementById('checkoutTotal').textContent = fmt(cartTotal());
  document.getElementById('checkoutModal').classList.add('show');
}

async function placeOrder(){
  const name = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  const address = document.getElementById('custAddress').value.trim();
  const notes = document.getElementById('custNotes').value.trim();
  if(!name){ alert('Please enter your name'); return; }
  if(!/^[0-9]{10}$/.test(phone)){ alert('Please enter a valid 10-digit mobile number'); return; }
  if(!address){ alert('Please enter your delivery address'); return; }
  const btn = document.getElementById('placeOrderBtn');
  btn.disabled = true; btn.textContent = 'Placing order…';
  try{
    const orderData = {
      custName: name, custPhone: phone, custAddress: address, notes: notes,
      items: Object.values(cart).map(i=>({id:i.id,name:i.name,price:i.price,unit:i.unit,qty:i.qty})),
      total: cartTotal(),
      status: 'pending',
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      createdAtStr: new Date().toLocaleString('en-IN')
    };
    const ref = await db.collection('orders').add(orderData);
    closeModal('checkoutModal');
    document.getElementById('orderIdShow').textContent = 'Order ID: ' + ref.id.slice(-6).toUpperCase();
    document.getElementById('successModal').classList.add('show');
    cart = {}; updateCartBar();
  }catch(e){
    alert('Could not place order. Please check your internet and try again.');
    console.error(e);
  }
  btn.disabled = false; btn.textContent = '✅ Place Order';
}

loadCatalog();
</script>
</body>
</html>
